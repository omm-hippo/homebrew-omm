# brew tap-new uses this file to generate an autobump workflow for the new tap
name: brew bump

on:
  repository_dispatch:
    types:
      - pypi_release_verified
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
      - .github/scripts/*.py
      - tests/*.py
  schedule:
    # Retry every six hours. Homebrew's upstream release cooldown still decides
    # when a newly published PyPI version becomes eligible for a Formula PR.
    - cron: 35 */6 * * *

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the Tap validation code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The repository_dispatch path pushes the bump branch with a plain
          # `git push origin` (see "Prepare the verified PyPI Formula"), which
          # needs the checkout-persisted credential. Without it that push dies
          # with "could not read Username for 'https://github.com'" and no bump
          # PR is ever opened. The scheduled `brew bump` path is unaffected --
          # it authenticates through HOMEBREW_GITHUB_API_TOKEN.
          persist-credentials: true

      - name: Validate the verified-PyPI dispatch
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ github.event.client_payload.version }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository }}
          SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          SOURCE_TAG: ${{ github.event.client_payload.tag }}
        run: python3 .github/scripts/validate_pypi_dispatch.py

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        with:
          core: true

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1

      - name: Bump formulae
        id: bump
        if: github.event_name != 'repository_dispatch'
        continue-on-error: true
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew bump --no-fork --open-pr --formulae --bump-synced --tap="$TAP_NAME"

      - name: Prepare the verified PyPI Formula and Python resources
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ github.event.client_payload.version }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: |
          version="$REQUESTED_VERSION"
          branch="bump-omm-$version"
          updater="$RUNNER_TEMP/update_formula_from_pypi.py"
          verifier="$RUNNER_TEMP/verify_python_resources.py"
          generated_resources="$RUNNER_TEMP/omm-$version-resources.rb"
          cp .github/scripts/update_formula_from_pypi.py "$updater"
          cp .github/scripts/verify_python_resources.py "$verifier"

          remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
          git switch -C "$branch" origin/main

          python3 "$updater" --formula=Formula/omm.rb --version="$version"
          brew update-python-resources --print-only \
            --ignore-main-package-cooldown \
            --version="$version" \
            --package-name=omm-model \
            "$TAP_NAME/omm" > "$generated_resources"
          python3 "$verifier" --sync \
            --formula=Formula/omm.rb \
            --generated="$generated_resources"

          changed_paths="$(git diff --name-only)"
          if [[ -n "$changed_paths" ]]
          then
            test "$changed_paths" = "Formula/omm.rb"
            brew audit --strict "$TAP_NAME/omm"
            git add Formula/omm.rb
            git commit -m "build: OMM $version Formula 및 Python 리소스 갱신"
          else
            echo "Formula already matches verified PyPI OMM $version; no PR needed"
            exit 0
          fi

          test "$(git diff --name-only origin/main...HEAD)" = "Formula/omm.rb"
          brew audit --strict "$TAP_NAME/omm"
          if [[ -n "$remote_sha" ]]
          then
            git fetch origin "$branch"
            test "$(git diff --name-only origin/main..."origin/$branch")" = "Formula/omm.rb"
            if ! git diff --quiet HEAD "origin/$branch" -- Formula/omm.rb
            then
              echo "Existing $branch differs from the freshly verified Formula" >&2
              exit 1
            fi
          else
            git push origin "HEAD:refs/heads/$branch"
          fi

          if ! gh pr view "$branch" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          then
            gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" --base main \
              --title "omm $version" \
              --body "검증된 PyPI OMM $version에 맞춰 Formula source와 Python resource를 함께 갱신합니다. 주 패키지의 1일 cooldown만 우회하며 dependency cooldown과 PR 검증은 유지합니다."
          fi

      - name: Ensure a pull request exists for the bump branch
        if: steps.bump.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: |
          branch="$(git branch --show-current)"
          case "$branch" in
            bump-omm-*) ;;
            *)
              echo "brew bump failed before creating an OMM bump branch: $branch" >&2
              exit 1
              ;;
          esac

          remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
          if [[ -z "$remote_sha" ]]; then
            # Nothing on the remote yet: this attempt's local commit is the
            # one to publish.
            test "$(git rev-list --count origin/main..HEAD)" -eq 1
            test "$(git diff --name-only origin/main...HEAD)" = "Formula/omm.rb"
            brew audit --strict "$TAP_NAME/omm"
            git push origin "HEAD:refs/heads/$branch"
          else
            # A prior run already pushed this branch (brew bump's --open-pr
            # push succeeded but PR creation failed), so trying to push
            # another freshly generated commit here would be a
            # non-fast-forward reject. Reuse what's already on the remote.
            git fetch origin "$branch"
            git switch -C "$branch" "origin/$branch"
            test "$(git rev-list --count origin/main.."$branch")" -eq 1
            test "$(git diff --name-only origin/main..."$branch")" = "Formula/omm.rb"
            brew audit --strict "$TAP_NAME/omm"
          fi

          if ! gh pr view "$branch" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          then
            gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" --base main \
              --title "omm ${branch#bump-omm-}" \
              --body "Automated Homebrew Formula bump. Opened by the autobump fallback after \`brew bump --open-pr\` pushed the commit but failed to open the pull request itself."
          fi
