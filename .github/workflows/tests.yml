# brew tap-new uses this file to generate a PR test workflow for the new tap
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  dispatch-validator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the Tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the PyPI dispatch validator
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  test-bot:
    needs: dispatch-validator
    strategy:
      # One platform's failure (e.g. a transient Homebrew-core bottle gap on
      # the aging Intel macOS runner) should not mask the others' results.
      fail-fast: false
      matrix:
        os: [ macos-26, macos-15-intel ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - name: Verify Formula Python resources match public PyPI metadata
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: |
          tap_root="$(brew --repository "$TAP_NAME")"
          generated_resources="$(mktemp)"
          brew update-python-resources --print-only \
            --ignore-main-package-cooldown \
            --package-name=omm-model \
            "$TAP_NAME/omm" > "$generated_resources"
          python3 "$tap_root/.github/scripts/verify_python_resources.py" \
            --formula="$tap_root/Formula/omm.rb" \
            --generated="$generated_resources"

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Exercise Formula on Intel macOS
        if: github.event_name == 'pull_request' && matrix.os == 'macos-15-intel'
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: |
          formula="$TAP_NAME/omm"
          if brew list --formula "$formula" >/dev/null 2>&1
          then
            brew uninstall --formula --force "$formula"
          fi
          brew install --formula --build-from-source "$formula"
          brew test --verbose "$formula"
          "$(brew --prefix "$formula")/bin/omm" --version
          "$(brew --prefix "$formula")/bin/omm" --help

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
