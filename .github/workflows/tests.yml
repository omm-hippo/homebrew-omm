# brew tap-new uses this file to generate a PR test workflow for the new tap
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  dispatch-validator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the Tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the PyPI dispatch validator
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  test-bot:
    needs: dispatch-validator
    strategy:
      # One platform's failure should not mask the others' results.
      # No Intel macOS job: Homebrew-core ships no Intel bottles for rust,
      # python@3.14 or openssl@3 (formulae.brew.sh), so `--build-from-source`
      # compiles the whole toolchain and runs for hours.
      fail-fast: false
      matrix:
        os: [ macos-26 ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - name: Verify Formula Python resources match public PyPI metadata
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: |
          tap_root="$(brew --repository "$TAP_NAME")"
          generated_resources="$(mktemp)"
          brew update-python-resources --print-only \
            --ignore-main-package-cooldown \
            --package-name=omm-model \
            "$TAP_NAME/omm" > "$generated_resources"
          # The brew container does not put `python3` on PATH (exit 127), and the
          # `python3` alias may point at a newer Python than the one the
          # Formula (and `update-python-resources`) installs. Use the Formula's
          # own Python, via the unversioned `python` in its libexec/bin.
          python_formula="$(sed -nE 's/^[[:space:]]*depends_on "(python@[0-9.]+)".*/\1/p' "$tap_root/Formula/omm.rb" | head -n 1)"
          "$(brew --prefix "$python_formula")/libexec/bin/python" "$tap_root/.github/scripts/verify_python_resources.py" \
            --formula="$tap_root/Formula/omm.rb" \
            --generated="$generated_resources"

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
