# brew tap-new uses this file to generate a PR test workflow for the new tap
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  dispatch-validator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the Tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the PyPI dispatch validator
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  test-bot:
    needs: dispatch-validator
    strategy:
      # One platform's failure should not mask the others' results.
      # No Intel macOS job: Homebrew-core ships no Intel bottles for rust,
      # python@3.14 or openssl@3 (formulae.brew.sh), so `--build-from-source`
      # compiles the whole toolchain and runs for hours.
      fail-fast: false
      matrix:
        os: [ macos-26 ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      # Immutable, reviewed frozen graph from omm-hippo/omm PR #509.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        # setup-homebrew has a global Authorization header. Isolate this
        # checkout's auth config so checkout cannot send a duplicate header.
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/runtime-graph.gitconfig
        with:
          repository: omm-hippo/omm
          ref: 1d18743ad88be77399d7b5ad7b9c80cb90d877f5
          path: .runtime-graph
          persist-credentials: false
      - name: Verify Formula against the pinned OMM runtime graph and PyPI hashes
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: |
          tap_root="$(brew --repository "$TAP_NAME")"
          python_formula="$(sed -nE 's/^[[:space:]]*depends_on "(python@[0-9.]+)".*/\1/p' "$tap_root/Formula/omm.rb" | head -n 1)"
          brew install "$python_formula"
          "$(brew --prefix "$python_formula")/libexec/bin/python" -m venv "$RUNNER_TEMP/omm-graph-check"
          graph_python="$RUNNER_TEMP/omm-graph-check/bin/python"
          "$graph_python" -m pip install --disable-pip-version-check packaging==26.3
          formula_version="$("$graph_python" -c 'import re,sys; print(re.search(r"omm_model-([0-9.]+)\.tar\.gz",open(sys.argv[1]).read()).group(1))' "$tap_root/Formula/omm.rb")"
          "$graph_python" "$GITHUB_WORKSPACE/.runtime-graph/scripts/homebrew_formula.py" check \
            --formula "$tap_root/Formula/omm.rb" --version "$formula_version" \
            --requirements "$GITHUB_WORKSPACE/.runtime-graph/requirements-npm-binary.txt"

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
